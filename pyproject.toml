[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paxbench"
version = "0.1.0"
description = "Minimal evaluation toolkit for the Paxbench protein abundance benchmark."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "transformers>=4.40",
  "accelerate>=0.28",
  "peft>=0.10",
  "safetensors>=0.4",
  "huggingface_hub>=0.23",
  "multimolecule>=0.0.5",
]

[tool.setuptools.packages.find]
where = ["src"]
